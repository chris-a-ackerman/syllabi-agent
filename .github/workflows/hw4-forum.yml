# HW4 (SYL-111): the forum agent on GitHub Actions instead of Maritime/OpenClaw.
# One run = one cycle. Memory lives in state/ and is committed back to main after every run, so
# the next run (a fresh runner) starts from what the last one knew. See state/README.md and the
# "HW4: GitHub Actions runner" section of README.md.
#
# Secrets: CANVAS_FORUM_TOKEN, ANTHROPIC_API_KEY. Variables: CANVAS_BASE_URL, CANVAS_FORUM_TOPIC_ID.
# Never `set -x` here and never print the environment: the token is in it.
name: hw4-forum

on:
  schedule:
    - cron: "17 */2 * * *"   # UTC, every 2 hours at :17
  workflow_dispatch:
    inputs:
      command:
        description: "cycle (default), status or report"
        type: choice
        options: [cycle, status, report]
        default: cycle
      fault:
        description: "test hook: lost_ack does the real POST and drops the answer (empty = off)"
        type: string
        default: ""

concurrency:
  group: hw4-forum
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  forum:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # a first read can mean several model calls of up to 120 s each
    steps:
      - name: checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # HW4-4 (SYL-115): delivered tests run in this image (no network, read-only, 512 MB, 60 s).
      # Pulled here, in a step with no secrets, so the cycle's sandbox runs never need the network.
      - name: sandbox image
        if: inputs.command == '' || inputs.command == 'cycle'
        run: docker pull -q python:3.12-slim

      - name: cycle
        env:
          CANVAS_BASE_URL: ${{ vars.CANVAS_BASE_URL }}
          CANVAS_FORUM_COURSE_ID: "40577"
          CANVAS_FORUM_TOPIC_ID: ${{ vars.CANVAS_FORUM_TOPIC_ID }}
          CANVAS_FORUM_TOKEN: ${{ secrets.CANVAS_FORUM_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HW4_MODEL: ${{ vars.HW4_MODEL }}
          HW4_EFFORT: ${{ vars.HW4_EFFORT }}
          # HW4-4 (SYL-115): the delegated job, a package under workspace/hw4/task/ (empty =
          # control_state_tests). The sandbox is docker; sandbox.py gives the child process a
          # fresh env, so the two secrets above never reach the delivered tests.
          HW4_TASK: ${{ vars.HW4_TASK }}
          DATA_DIR: ${{ github.workspace }}/state
          TZ: America/New_York
          # HW4-3 (SYL-114): a syllabus request can be up to 12,000 characters and the reply (table,
          # calendar, estimate) up to 8,000; forum.py's defaults (4,000 and 2,000) stay for everything else.
          FORUM_TEXT_MAX: "8000"
          FORUM_ENTRY_TEXT_CAP: "12000"
          FORUM_COMMAND: ${{ inputs.command || 'cycle' }}
          FORUM_FAULT: ${{ inputs.fault }}
          FORUM_FAULT_OK: ${{ inputs.fault != '' && '1' || '' }}
        run: |
          set -eu
          forum=workspace/skills/forum/scripts/forum.py
          case "$FORUM_COMMAND" in
            cycle|status|report) ;;
            *) printf 'unknown command: %s\n' "$FORUM_COMMAND" >&2; exit 2 ;;
          esac
          if [ "$FORUM_COMMAND" = report ]; then
            python3 "$forum" report > "$RUNNER_TEMP/report.json"
            python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["markdown"])' \
              "$RUNNER_TEMP/report.json" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          status_rc=0
          python3 "$forum" status > "$RUNNER_TEMP/status.json" || status_rc=$?
          cat "$RUNNER_TEMP/status.json"
          python3 scripts/hw4-log-status.py < "$RUNNER_TEMP/status.json"
          if [ "$status_rc" -ne 0 ]; then
            exit "$status_rc"
          fi
          # HW4-2/3/4 (SYL-113, SYL-114, SYL-115): one driver cycle (read, classify, offer, one job,
          # check a delivered result, discovery, request).
          if [ "$FORUM_COMMAND" = cycle ]; then
            python3 scripts/hw4-cycle.py cycle
          fi

      - name: commit state
        if: always() && steps.checkout.outcome == 'success'
        run: |
          set -eu
          git config user.name "syllabi-agent[bot]"
          git config user.email "syllabi-agent-bot@users.noreply.github.com"
          git add state/
          # HW4-4 (SYL-115): an accepted delivery becomes a test file in the suite.
          if ls tests/test_hw4_delegated_*.py >/dev/null 2>&1; then
            git add tests/test_hw4_delegated_*.py
          fi
          if git diff --cached --quiet; then
            printf 'state/ unchanged; nothing to commit\n'
            exit 0
          fi
          # No "[skip ci]" here: GitHub skips the cron trigger while the head of main carries it, and
          # this commit is usually that head. Pushes made with GITHUB_TOKEN trigger no workflows anyway.
          git commit -q -m "hw4: state after run ${{ github.run_id }}"
          for try in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$try" -lt 4 ]; then sleep $((try * 5)); fi
          done
          printf 'could not push the state commit after 3 retries\n' >&2
          exit 1

      - name: upload logs
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: hw4-forum-logs-${{ github.run_id }}
          path: state/logs/
          retention-days: 14
          if-no-files-found: ignore
